<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>AR เครื่องซักผ้า Front View + Dino</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js marker tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /*
      กล้องจริงจาก AR.js อยู่ด้านหลัง A-Frame scene
      UI ด้านบน/ล่างเป็น HTML overlay
    */
    #ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    #topPanel {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(94vw, 680px);
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(8, 18, 28, 0.82);
      color: #fff;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #topPanel strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    #topPanel span {
      display: block;
      font-size: 12px;
      line-height: 1.4;
      opacity: .92;
    }

    #status {
      margin-top: 6px;
      color: #b9f6c2;
      font-weight: 800;
    }

    #controls {
      pointer-events: auto;
      position: absolute;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(94vw, 680px);
      padding: 12px 14px;
      border-radius: 17px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 12px 34px rgba(0,0,0,.30);
    }

    .sliderRow {
      display: grid;
      grid-template-columns: auto 1fr 62px;
      gap: 10px;
      align-items: center;
    }

    #controls label {
      font-size: 13px;
      font-weight: 800;
      color: #1b2730;
      white-space: nowrap;
    }

    #speed {
      width: 100%;
      accent-color: #2e8b46;
    }

    #speedValue {
      text-align: right;
      font-weight: 900;
      color: #1f7a3a;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 11px;
      padding: 10px;
      color: white;
      background: #1f7a3a;
      font-weight: 800;
      font-size: 14px;
    }

    button.secondary { background: #5e6b75; }

    .note {
      margin-top: 7px;
      color: #687783;
      font-size: 11px;
      line-height: 1.35;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    @media (max-width: 520px) {
      .sliderRow {
        grid-template-columns: 1fr 56px;
      }
      .sliderRow label {
        grid-column: 1 / -1;
      }
    }
  </style>

  <script>
    window.WASHER = {
      running: false,
      speed: 45,
      clockwise: true
    };

    /*
      FRONT VIEW:
      ทำให้ชุดโมเดลทั้งหมดหันหน้ามาทางกล้องตลอดเวลา
      จึงไม่เห็นเครื่องซักผ้าจากด้านบน แม้ Hiro Marker จะวางราบ
    */
    AFRAME.registerComponent('front-view-camera', {
      init: function () {
        this.cameraWorld = new THREE.Vector3();
        this.objectWorld = new THREE.Vector3();
      },

      tick: function () {
        const scene = this.el.sceneEl;
        if (!scene || !scene.camera) return;

        scene.camera.getWorldPosition(this.cameraWorld);
        this.el.object3D.getWorldPosition(this.objectWorld);

        // หันแกนหน้าของชุดโมเดลไปที่กล้อง
        this.el.object3D.lookAt(this.cameraWorld);
      }
    });

    /*
      หมุนถังซักบนแกน Z เพราะเรากำลังมองหน้าตรง
    */
    AFRAME.registerComponent('washer-spin', {
      tick: function (time, delta) {
        const state = window.WASHER;
        if (!delta || !state.running || state.speed <= 0) return;

        const degreesPerSecond = 35 + state.speed * 5.2;
        const direction = state.clockwise ? -1 : 1;

        this.el.object3D.rotation.z += THREE.MathUtils.degToRad(
          degreesPerSecond * direction * delta / 1000
        );
      }
    });

    AFRAME.registerComponent('dino-bob', {
      init: function () {
        this.baseY = this.el.object3D.position.y;
      },
      tick: function (time) {
        this.el.object3D.position.y =
          this.baseY + Math.sin(time / 260) * 0.022;
      }
    });

    AFRAME.registerComponent('arm-wave', {
      schema: {
        side: { default: 1 }
      },
      tick: function (time) {
        const angle = Math.sin(time / 180) * 18 * this.data.side;
        this.el.object3D.rotation.z = THREE.MathUtils.degToRad(angle);
      }
    });

    AFRAME.registerComponent('washer-screen', {
      tick: function () {
        const s = window.WASHER;
        const value =
          (s.running && s.speed > 0) ? ('SPIN ' + s.speed + '%') : 'OFF';

        if (this.el.getAttribute('value') !== value) {
          this.el.setAttribute('value', value);
        }
      }
    });

    window.addEventListener('DOMContentLoaded', function () {
      const marker = document.getElementById('hiroMarker');
      const status = document.getElementById('status');
      const speed = document.getElementById('speed');
      const speedValue = document.getElementById('speedValue');
      const toggle = document.getElementById('toggle');
      const reverse = document.getElementById('reverse');

      function refreshButtons() {
        speedValue.textContent = window.WASHER.speed + '%';
        toggle.textContent =
          window.WASHER.running ? 'หยุดหมุน' : 'เริ่มหมุน';
        reverse.textContent =
          window.WASHER.clockwise ? 'หมุนขวา' : 'หมุนซ้าย';
      }

      speed.addEventListener('input', function () {
        window.WASHER.speed = Number(this.value);
        refreshButtons();
      });

      toggle.addEventListener('click', function () {
        window.WASHER.running = !window.WASHER.running;
        refreshButtons();
      });

      reverse.addEventListener('click', function () {
        window.WASHER.clockwise = !window.WASHER.clockwise;
        refreshButtons();
      });

      marker.addEventListener('markerFound', function () {
        status.textContent =
          'พบ Hiro Marker • กำลังแสดงภาพจริง + โมเดล A-Frame 3D';
      });

      marker.addEventListener('markerLost', function () {
        status.textContent =
          'ยังไม่พบ Hiro Marker • เล็งกล้องให้เห็น Marker เต็มกรอบ';
      });

      document.body.addEventListener('camera-init', function () {
        status.textContent =
          'กล้องพร้อมแล้ว • เล็งไปที่ Hiro Marker';
      });

      document.body.addEventListener('camera-error', function () {
        status.textContent =
          'เปิดกล้องไม่ได้ • ตรวจสอบสิทธิ์ Camera และ HTTPS';
      });

      refreshButtons();
    });
  </script>
</head>

<body>

  <!-- HTML UI Overlay -->
  <div id="ui">
    <div id="topPanel">
      <strong>AR เครื่องซักผ้า — Front View</strong>
      <span>
        ภาพจริงจากกล้องอยู่ด้านหลัง และ A‑Frame 3D จะซ้อนบน Hiro Marker
        โดยหันด้านหน้าของเครื่องเข้าหากล้องอัตโนมัติ
      </span>
      <span id="status">กำลังเปิดกล้อง…</span>
    </div>

    <div id="controls">
      <div class="sliderRow">
        <label for="speed">ความเร็วถังซัก</label>
        <input id="speed" type="range" min="0" max="100" value="45">
        <div id="speedValue">45%</div>
      </div>

      <div class="buttons">
        <button id="toggle">เริ่มหมุน</button>
        <button id="reverse" class="secondary">หมุนขวา</button>
      </div>

      <div class="note">
        เปิดผ่าน HTTPS บน Safari/Chrome แล้วอนุญาต Camera
        จากนั้นนำ Hiro Marker เข้าในภาพกล้อง
      </div>
    </div>
  </div>


  <!-- A-FRAME + AR.JS -->
  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true; antialias:true; precision:medium;"
    arjs="sourceType:webcam; videoTexture:true; debugUIEnabled:false;"
  >

    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="4"
    >

      <!--
        ชุด AR ทั้งหมดถูกยึดกับ Hiro Marker
        แต่ front-view-camera จะหันชุดนี้เข้าหากล้องตลอด
      -->
      <a-entity
        id="frontViewGroup"
        position="0 0.55 0"
        scale="0.72 0.72 0.72"
        front-view-camera
      >

        <!-- แสง -->
        <a-light
          type="ambient"
          color="#ffffff"
          intensity="1.15">
        </a-light>

        <a-light
          type="directional"
          color="#ffffff"
          intensity="1.05"
          position="-1 2 2">
        </a-light>


        <!-- ========================================= -->
        <!-- เครื่องซักผ้า : ด้านหน้าหันเข้าหากล้อง -->
        <!-- ========================================= -->
        <a-entity id="washer" position="-0.34 0 0">

          <!-- ตัวเครื่อง -->
          <a-box
            width="0.72"
            height="1.02"
            depth="0.40"
            material="
              color:#101419;
              roughness:0.42;
              metalness:0.38;">
          </a-box>

          <!-- ขอบบน -->
          <a-box
            position="0 0.405 0.206"
            width="0.67"
            height="0.16"
            depth="0.025"
            material="color:#272e34; roughness:.45;">
          </a-box>

          <!-- จอ -->
          <a-plane
            position="-0.15 0.405 0.222"
            width="0.27"
            height="0.085"
            material="color:#081013;">
          </a-plane>

          <a-text
            position="-0.15 0.405 0.238"
            value="OFF"
            align="center"
            width="0.62"
            color="#a9f3b1"
            washer-screen>
          </a-text>

          <!-- ลูกบิด -->
          <a-cylinder
            position="0.20 0.405 0.24"
            rotation="90 0 0"
            radius="0.066"
            height="0.055"
            material="
              color:#6c747a;
              metalness:.72;
              roughness:.28;">
          </a-cylinder>

          <a-cylinder
            position="0.20 0.405 0.273"
            rotation="90 0 0"
            radius="0.042"
            height="0.016"
            material="color:#20252a;">
          </a-cylinder>


          <!-- กรอบประตู -->
          <a-torus
            position="0 -0.08 0.222"
            radius="0.268"
            radius-tubular="0.054"
            segments-radial="18"
            segments-tubular="48"
            material="
              color:#525c63;
              metalness:.60;
              roughness:.28;">
          </a-torus>

          <!-- กระจก -->
          <a-circle
            position="0 -0.08 0.226"
            radius="0.218"
            segments="48"
            material="
              color:#172833;
              opacity:.88;
              transparent:true;
              metalness:.25;
              roughness:.18;">
          </a-circle>

          <!-- Highlight กระจก -->
          <a-circle
            position="-0.055 0.005 0.231"
            radius="0.060"
            scale="1.5 .45 1"
            material="
              color:#bfe9ff;
              opacity:.18;
              transparent:true;">
          </a-circle>


          <!-- ถังซักด้านใน -->
          <a-entity
            id="drum"
            position="0 -0.08 0.240"
            washer-spin
          >
            <a-torus
              radius="0.172"
              radius-tubular="0.010"
              material="
                color:#c1c9ce;
                opacity:.82;
                transparent:true;">
            </a-torus>

            <a-box
              position="0 0.076 0"
              width="0.032"
              height="0.135"
              depth="0.014"
              material="color:#89959c;">
            </a-box>

            <a-box
              position="-0.066 -0.043 0"
              rotation="0 0 120"
              width="0.032"
              height="0.135"
              depth="0.014"
              material="color:#89959c;">
            </a-box>

            <a-box
              position="0.066 -0.043 0"
              rotation="0 0 -120"
              width="0.032"
              height="0.135"
              depth="0.014"
              material="color:#89959c;">
            </a-box>
          </a-entity>

          <!-- ขา -->
          <a-box
            position="-0.24 -0.53 0"
            width="0.11"
            height="0.055"
            depth="0.26"
            material="color:#080a0c;">
          </a-box>

          <a-box
            position="0.24 -0.53 0"
            width="0.11"
            height="0.055"
            depth="0.26"
            material="color:#080a0c;">
          </a-box>

        </a-entity>


        <!-- ========================================= -->
        <!-- ไดโนเสาร์อ้วน หันหน้ามาด้านเดียวกับเครื่อง -->
        <!-- ========================================= -->
        <a-entity
          id="dino"
          position="0.57 -0.12 0.05"
          scale="0.82 0.82 0.82"
          dino-bob
        >

          <!-- ตัว -->
          <a-sphere
            position="0 0 0"
            radius="0.28"
            scale="1 1.12 .86"
            material="color:#65c466; roughness:.82;">
          </a-sphere>

          <!-- พุง -->
          <a-sphere
            position="0 -0.04 0.225"
            radius="0.185"
            scale=".88 1.04 .26"
            material="color:#a6e58b; roughness:.84;">
          </a-sphere>

          <!-- หัว -->
          <a-sphere
            position="0 .335 .035"
            radius=".235"
            scale="1.04 .91 .89"
            material="color:#65c466; roughness:.82;">
          </a-sphere>

          <!-- ปากยื่น -->
          <a-sphere
            position="0 .275 .225"
            radius=".15"
            scale="1.12 .60 .60"
            material="color:#8bd578; roughness:.85;">
          </a-sphere>

          <!-- ตาซ้าย -->
          <a-sphere
            position="-.084 .398 .205"
            radius=".049"
            scale=".85 1.05 .40"
            material="color:#fff;">
          </a-sphere>

          <a-sphere
            position="-.084 .398 .243"
            radius=".019"
            scale=".9 1 .45"
            material="color:#17251b;">
          </a-sphere>

          <!-- ตาขวา -->
          <a-sphere
            position=".084 .398 .205"
            radius=".049"
            scale=".85 1.05 .40"
            material="color:#fff;">
          </a-sphere>

          <a-sphere
            position=".084 .398 .243"
            radius=".019"
            scale=".9 1 .45"
            material="color:#17251b;">
          </a-sphere>

          <!-- รูจมูก -->
          <a-sphere
            position="-.052 .298 .313"
            radius=".013"
            scale="1 .8 .35"
            material="color:#317a38;">
          </a-sphere>

          <a-sphere
            position=".052 .298 .313"
            radius=".013"
            scale="1 .8 .35"
            material="color:#317a38;">
          </a-sphere>

          <!-- ยิ้ม -->
          <a-torus
            position="0 .225 .314"
            radius=".064"
            radius-tubular=".007"
            theta-start="205"
            theta-length="130"
            material="color:#245c2b;">
          </a-torus>

          <!-- แขนซ้าย -->
          <a-entity
            position="-.265 .035 .05"
            arm-wave="side:-1"
          >
            <a-sphere
              radius=".105"
              scale="1.34 .42 .47"
              rotation="0 0 -20"
              material="color:#65c466;">
            </a-sphere>
          </a-entity>

          <!-- แขนขวา -->
          <a-entity
            position=".265 .035 .05"
            arm-wave="side:1"
          >
            <a-sphere
              radius=".105"
              scale="1.34 .42 .47"
              rotation="0 0 20"
              material="color:#65c466;">
            </a-sphere>
          </a-entity>

          <!-- เท้า -->
          <a-sphere
            position="-.13 -.30 .10"
            radius=".103"
            scale="1.24 .46 1"
            material="color:#4aa451;">
          </a-sphere>

          <a-sphere
            position=".13 -.30 .10"
            radius=".103"
            scale="1.24 .46 1"
            material="color:#4aa451;">
          </a-sphere>

          <!-- หาง -->
          <a-cone
            position="0 -.03 -.20"
            rotation="-75 0 0"
            radius-bottom=".10"
            radius-top=".02"
            height=".32"
            material="color:#54b85a;">
          </a-cone>

        </a-entity>

      </a-entity>
    </a-marker>

    <!-- กล้อง AR -->
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
