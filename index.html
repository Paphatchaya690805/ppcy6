<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AR เครื่องซักผ้า + ไดโนเสาร์</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js รุ่น Marker Tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    :root{
      --green:#65c466;
      --panel:rgba(255,255,255,.94);
      --dark:#11151a;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#000;
    }

    /* UI ด้านบน - ไม่ใช่วัตถุ AR */
    .ui{
      position:fixed;
      inset:0;
      z-index:20;
      pointer-events:none;
    }

    .top-card{
      position:absolute;
      top:max(12px, env(safe-area-inset-top));
      left:50%;
      transform:translateX(-50%);
      width:min(94vw,680px);
      padding:12px 14px;
      border-radius:16px;
      background:rgba(17,21,26,.82);
      color:#fff;
      box-shadow:0 10px 30px #0005;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .top-card h1{
      margin:0 0 4px;
      font-size:18px;
    }

    .top-card p{
      margin:0;
      color:#d8e1e8;
      font-size:13px;
      line-height:1.35;
    }

    #status{
      margin-top:7px;
      color:#b9f6c2;
      font-weight:800;
      font-size:13px;
    }

    .controls{
      pointer-events:auto;
      position:absolute;
      left:50%;
      bottom:max(14px, env(safe-area-inset-bottom));
      transform:translateX(-50%);
      width:min(94vw,680px);
      padding:13px 14px;
      border-radius:18px;
      background:var(--panel);
      color:#18212a;
      box-shadow:0 12px 35px #0005;
    }

    .speed-row{
      display:grid;
      grid-template-columns:auto 1fr 62px;
      gap:10px;
      align-items:center;
    }

    .controls label{
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .controls input{
      width:100%;
      accent-color:#3c9c52;
    }

    .value{
      font-weight:900;
      text-align:right;
    }

    .buttons{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    button{
      flex:1;
      border:0;
      border-radius:11px;
      padding:10px 12px;
      background:#1f7a3a;
      color:#fff;
      font-weight:800;
      font-size:14px;
    }

    button.secondary{
      background:#5e6b75;
    }

    .small{
      margin-top:8px;
      font-size:11px;
      line-height:1.35;
      color:#687783;
    }

    .a-enter-vr,
    .a-enter-ar{
      display:none !important;
    }

    @media (max-width:520px){
      .top-card h1{font-size:16px}
      .top-card p{font-size:12px}
      .speed-row{grid-template-columns:1fr 54px}
      .controls label{grid-column:1 / -1}
    }
  </style>

  <script>
    /*
      ค่าควบคุมเครื่องซักผ้า
    */
    window.WASHER_STATE = {
      running: false,
      speed: 45,
      clockwise: true
    };

    /*
      หมุนถังซักตาม slider
      speed 0-100 -> ปรับเป็นองศาต่อวินาที
    */
    AFRAME.registerComponent('washer-spin', {
      tick: function(time, delta){
        const s = window.WASHER_STATE;
        if (!s.running || s.speed <= 0 || !delta) return;

        const degPerSecond = 30 + (s.speed * 5.2);
        const direction = s.clockwise ? -1 : 1;

        this.el.object3D.rotation.z += THREE.MathUtils.degToRad(
          degPerSecond * direction * (delta / 1000)
        );
      }
    });

    /*
      ทำให้ไดโนเสาร์หันหน้าเข้าหากล้องตลอดเวลา
      หมุนเฉพาะแกน Y จึงยังตั้งตรงบน Hiro Marker
    */
    AFRAME.registerComponent('face-camera-y', {
      init: function(){
        this.cameraPos = new THREE.Vector3();
        this.selfPos = new THREE.Vector3();
      },

      tick: function(){
        const scene = this.el.sceneEl;
        if (!scene || !scene.camera) return;

        scene.camera.getWorldPosition(this.cameraPos);
        this.el.object3D.getWorldPosition(this.selfPos);

        const target = new THREE.Vector3(
          this.cameraPos.x,
          this.selfPos.y,
          this.cameraPos.z
        );

        this.el.object3D.lookAt(target);
      }
    });

    /*
      ไดโนเสาร์เด้งเบา ๆ ให้น่ารัก
    */
    AFRAME.registerComponent('dino-bob', {
      init: function(){
        this.baseY = this.el.object3D.position.y;
      },

      tick: function(time){
        this.el.object3D.position.y =
          this.baseY + Math.sin(time / 280) * 0.025;
      }
    });

    /*
      ไฟสถานะเครื่องซักผ้า
    */
    AFRAME.registerComponent('washer-display', {
      tick: function(){
        const s = window.WASHER_STATE;
        const text = this.el.getAttribute('text') || {};

        let value = 'OFF';
        if (s.running && s.speed > 0) value = 'SPIN ' + s.speed + '%';

        if (text.value !== value) {
          this.el.setAttribute('text', 'value', value);
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const speed = document.querySelector('#speed');
      const speedValue = document.querySelector('#speedValue');
      const toggle = document.querySelector('#toggle');
      const reverse = document.querySelector('#reverse');
      const status = document.querySelector('#status');
      const marker = document.querySelector('#hiroMarker');

      function updateUI(){
        const s = window.WASHER_STATE;
        speedValue.textContent = s.speed + '%';
        toggle.textContent = s.running ? 'หยุดหมุน' : 'เริ่มหมุน';
        reverse.textContent = s.clockwise ? 'หมุนขวา' : 'หมุนซ้าย';
      }

      speed.addEventListener('input', e => {
        window.WASHER_STATE.speed = Number(e.target.value);
        speedValue.textContent = e.target.value + '%';
      });

      toggle.addEventListener('click', () => {
        window.WASHER_STATE.running = !window.WASHER_STATE.running;
        updateUI();
      });

      reverse.addEventListener('click', () => {
        window.WASHER_STATE.clockwise = !window.WASHER_STATE.clockwise;
        updateUI();
      });

      marker.addEventListener('markerFound', () => {
        status.textContent = 'พบ Hiro Marker แล้ว • แสดงเครื่องซักผ้าและไดโนเสาร์';
      });

      marker.addEventListener('markerLost', () => {
        status.textContent = 'ไม่พบ Marker • หันกล้องไปที่ Hiro Marker';
      });

      /*
        AR.js จะส่ง event นี้เมื่อกล้องพร้อม
      */
      document.body.addEventListener('camera-init', () => {
        status.textContent = 'กล้องพร้อมแล้ว • หันกล้องไปที่ Hiro Marker';
      });

      document.body.addEventListener('camera-error', () => {
        status.textContent = 'เปิดกล้องไม่ได้ • กรุณาอนุญาต Camera และเปิดผ่าน HTTPS';
      });

      updateUI();
    });
  </script>
</head>

<body>

  <!-- UI Overlay -->
  <div class="ui">
    <div class="top-card">
      <h1>AR เครื่องซักผ้าสีดำ + ไดโนเสาร์อ้วน</h1>
      <p>
        อนุญาตการใช้กล้อง แล้วหันกล้องไปที่ <b>Hiro Marker</b>
        วัตถุจะปรากฏเฉพาะเมื่อ Marker ถูกตรวจพบ
      </p>
      <div id="status">กำลังเปิดกล้อง…</div>
    </div>

    <div class="controls">
      <div class="speed-row">
        <label for="speed">ความเร็วการหมุน</label>
        <input id="speed" type="range" min="0" max="100" value="45" />
        <span class="value" id="speedValue">45%</span>
      </div>

      <div class="buttons">
        <button id="toggle">เริ่มหมุน</button>
        <button class="secondary" id="reverse">หมุนขวา</button>
      </div>

      <div class="small">
        iPhone: เปิดไฟล์จากเว็บไซต์ HTTPS และกด Allow/อนุญาต Camera
        จากนั้นถือ Hiro Marker ให้เห็นเต็มกรอบและมีแสงเพียงพอ
      </div>
    </div>
  </div>


  <!-- ===================== AR SCENE ===================== -->
  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="antialias:true; alpha:true; precision:medium; logarithmicDepthBuffer:true;"
    arjs="sourceType:webcam; debugUIEnabled:false;"
  >

    <!--
      วัตถุทุกอย่างที่อยู่ภายใน a-marker
      จะปรากฏเฉพาะตอนกล้องตรวจพบ Hiro Marker
    -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- ย่อฉากให้พอดีกับ Marker -->
      <a-entity id="arContent" scale="0.72 0.72 0.72">

        <!-- แสง -->
        <a-light
          type="ambient"
          color="#ffffff"
          intensity="1.05">
        </a-light>

        <a-light
          type="directional"
          color="#ffffff"
          intensity="1.1"
          position="-1 2 1">
        </a-light>


        <!-- พื้นรอง -->
        <a-plane
          position="0 0.01 0"
          rotation="-90 0 0"
          width="2.15"
          height="1.55"
          material="color:#d9e7d2; opacity:0.72; transparent:true; side:double">
        </a-plane>


        <!-- ================= เครื่องซักผ้า ================= -->
        <a-entity id="washer" position="-0.33 0.58 0">

          <!-- ตัวเครื่อง -->
          <a-box
            width="0.78"
            height="1.05"
            depth="0.46"
            material="color:#11151a; roughness:0.5; metalness:0.35">
          </a-box>

          <!-- แผงด้านบน -->
          <a-box
            position="0 0.39 0.241"
            width="0.72"
            height="0.19"
            depth="0.025"
            material="color:#252b31; roughness:0.5">
          </a-box>

          <!-- Display -->
          <a-plane
            position="-0.16 0.40 0.258"
            width="0.27"
            height="0.095"
            material="color:#0c1115">
          </a-plane>

          <a-text
            position="-0.16 0.40 0.274"
            align="center"
            width="0.65"
            color="#a9f3b1"
            text="value:OFF; align:center; width:0.65"
            washer-display>
          </a-text>

          <!-- ปุ่มหมุน -->
          <a-cylinder
            position="0.22 0.40 0.27"
            rotation="90 0 0"
            radius="0.07"
            height="0.055"
            material="color:#555b60; metalness:0.7; roughness:0.35">
          </a-cylinder>

          <a-cylinder
            position="0.22 0.40 0.301"
            rotation="90 0 0"
            radius="0.045"
            height="0.02"
            material="color:#202428">
          </a-cylinder>


          <!-- กรอบฝาหน้า -->
          <a-torus
            position="0 -0.08 0.27"
            radius="0.275"
            radius-tubular="0.055"
            material="color:#515960; metalness:0.55; roughness:0.35">
          </a-torus>

          <!-- กระจกฝาหน้า -->
          <a-cylinder
            position="0 -0.08 0.255"
            rotation="90 0 0"
            radius="0.225"
            height="0.045"
            material="color:#18232a; opacity:0.92; transparent:true; metalness:0.25; roughness:0.2">
          </a-cylinder>

          <!-- ถังด้านในที่หมุน -->
          <a-entity
            id="drum"
            position="0 -0.08 0.292"
            washer-spin>

            <a-torus
              radius="0.18"
              radius-tubular="0.012"
              material="color:#aeb9bf; opacity:0.7; transparent:true">
            </a-torus>

            <a-box
              position="0 0.085 0"
              width="0.035"
              height="0.15"
              depth="0.02"
              material="color:#8d999f">
            </a-box>

            <a-box
              position="-0.074 -0.045 0"
              rotation="0 0 120"
              width="0.035"
              height="0.15"
              depth="0.02"
              material="color:#8d999f">
            </a-box>

            <a-box
              position="0.074 -0.045 0"
              rotation="0 0 -120"
              width="0.035"
              height="0.15"
              depth="0.02"
              material="color:#8d999f">
            </a-box>

            <a-sphere
              radius="0.04"
              scale="1 1 0.25"
              material="color:#68757c">
            </a-sphere>

          </a-entity>

          <!-- ฐาน -->
          <a-box
            position="0 -0.54 0"
            width="0.72"
            height="0.035"
            depth="0.40"
            material="color:#080a0c">
          </a-box>
        </a-entity>


        <!-- ================= ไดโนเสาร์ ================= -->
        <!-- face-camera-y ทำให้หน้าของไดโนเสาร์หันมาทางกล้อง -->
        <a-entity
          id="dino"
          position="0.63 0.31 0.10"
          scale="0.82 0.82 0.82"
          face-camera-y
          dino-bob>

          <!-- หางด้านหลัง -->
          <a-cone
            position="0 -0.02 -0.20"
            rotation="-75 0 0"
            radius-bottom="0.10"
            radius-top="0.025"
            height="0.34"
            material="color:#54b85a">
          </a-cone>

          <!-- ลำตัวอ้วน -->
          <a-sphere
            position="0 0 0"
            radius="0.29"
            scale="1 1.12 0.88"
            material="color:#65c466; roughness:0.8">
          </a-sphere>

          <!-- พุง -->
          <a-sphere
            position="0 -0.04 0.22"
            radius="0.19"
            scale="0.90 1.05 0.28"
            material="color:#a6e58b; roughness:0.85">
          </a-sphere>

          <!-- หัว -->
          <a-sphere
            position="0 0.34 0.035"
            radius="0.245"
            scale="1.04 0.90 0.90"
            material="color:#65c466; roughness:0.8">
          </a-sphere>

          <!-- จมูก/ปากยื่นมาด้านหน้า -->
          <a-sphere
            position="0 0.285 0.225"
            radius="0.155"
            scale="1.10 0.60 0.62"
            material="color:#8bd578; roughness:0.85">
          </a-sphere>

          <!-- ตาซ้าย -->
          <a-sphere
            position="-0.088 0.405 0.205"
            radius="0.052"
            scale="0.85 1.05 0.42"
            material="color:#ffffff">
          </a-sphere>

          <a-sphere
            position="-0.088 0.405 0.244"
            radius="0.020"
            scale="0.9 1 0.5"
            material="color:#18251b">
          </a-sphere>

          <!-- ตาขวา -->
          <a-sphere
            position="0.088 0.405 0.205"
            radius="0.052"
            scale="0.85 1.05 0.42"
            material="color:#ffffff">
          </a-sphere>

          <a-sphere
            position="0.088 0.405 0.244"
            radius="0.020"
            scale="0.9 1 0.5"
            material="color:#18251b">
          </a-sphere>

          <!-- รูจมูก -->
          <a-sphere
            position="-0.052 0.31 0.315"
            radius="0.014"
            scale="1 0.8 0.35"
            material="color:#317a38">
          </a-sphere>

          <a-sphere
            position="0.052 0.31 0.315"
            radius="0.014"
            scale="1 0.8 0.35"
            material="color:#317a38">
          </a-sphere>

          <!-- รอยยิ้ม -->
          <a-torus
            position="0 0.235 0.318"
            radius="0.067"
            radius-tubular="0.008"
            theta-start="200"
            theta-length="140"
            rotation="0 0 0"
            material="color:#245c2b">
          </a-torus>

          <!-- แขน -->
          <a-sphere
            position="-0.27 0.04 0.045"
            rotation="0 0 -25"
            radius="0.105"
            scale="1.35 0.42 0.48"
            material="color:#65c466">
          </a-sphere>

          <a-sphere
            position="0.27 0.04 0.045"
            rotation="0 0 25"
            radius="0.105"
            scale="1.35 0.42 0.48"
            material="color:#65c466">
          </a-sphere>

          <!-- เท้า -->
          <a-sphere
            position="-0.13 -0.30 0.10"
            radius="0.105"
            scale="1.25 0.48 1"
            material="color:#4aa451">
          </a-sphere>

          <a-sphere
            position="0.13 -0.30 0.10"
            radius="0.105"
            scale="1.25 0.48 1"
            material="color:#4aa451">
          </a-sphere>

        </a-entity>

      </a-entity>
    </a-marker>

    <!-- กล้อง AR -->
    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
